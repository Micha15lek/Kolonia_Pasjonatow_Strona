<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalendarz | Kolonia Pasjonatów</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        🌟 Kolonia Pasjonatów
    </div>

    <a
        href="index.html"
        class="button home-button">

        🏠 Strona główna

    </a>

    <button
        id="themeToggle"
        class="theme-toggle"
        type="button"
        aria-label="Zmień motyw">

        ☀️

    </button>

</header>


<main>

    <!-- =====================================================
         HERO
    ====================================================== -->

    <section class="hero">

        <h1>
            📅 Kalendarz
        </h1>

        <p>
            Najważniejsze wydarzenia i terminy
            związane z Kolonią Pasjonatów.
        </p>

    </section>


    <!-- =====================================================
         KALENDARZ
    ====================================================== -->

    <section class="calendar-page">

        <div class="calendar-header">

            <button
                class="button"
                id="previousMonth"
                type="button">

                ◀ Poprzedni

            </button>


            <div
                class="month-title"
                id="monthTitle">
            </div>


            <button
                class="button"
                id="nextMonth"
                type="button">

                Następny ▶

            </button>

        </div>


        <button
            class="button today-button"
            id="todayButton"
            type="button">

            📅 Dzisiaj

        </button>


        <div class="calendar">

            <div class="weekdays">

                <div class="weekday">Pon</div>
                <div class="weekday">Wt</div>
                <div class="weekday">Śr</div>
                <div class="weekday">Czw</div>
                <div class="weekday">Pt</div>
                <div class="weekday">Sob</div>
                <div class="weekday">Nd</div>

            </div>


            <div
                class="days"
                id="calendarDays">
            </div>

        </div>


        <!-- INFORMACJA O WYDARZENIU -->

        <div
            class="event-info"
            id="eventInfo"
            style="display: none;">

            <span
                class="event-type"
                id="eventType">
            </span>

            <h3 id="eventTitle"></h3>

            <div
                class="event-date"
                id="eventDate">
            </div>

            <p id="eventDescription"></p>

        </div>


        <!-- LEGENDA -->

        <div class="legend">

            <h3>
                📌 Legenda
            </h3>

            <div class="legend-items">

                <div class="legend-item">
                    <span class="legend-color legend-event"></span>
                    Wydarzenie
                </div>

                <div class="legend-item">
                    <span class="legend-color legend-holiday"></span>
                    Święto
                </div>

                <div class="legend-item">
                    <span class="legend-color legend-special"></span>
                    Wydarzenie specjalne
                </div>

                <div class="legend-item">
                    <span class="legend-color legend-today"></span>
                    Dzisiaj
                </div>

            </div>

        </div>

    </section>

</main>


<!-- =====================================================
     STOPKA
====================================================== -->

<footer>

    <p>
        © 2026 Kolonia Pasjonatów
    </p>

    <p>
        🌟 Oficjalna strona społeczności
    </p>

</footer>


<!-- =====================================================
     KALENDARZ — WYDARZENIA
====================================================== -->

<script>

const events = [

    {
        start: "2026-08-10",
        end: "2026-08-10",
        title: "Start Strefy STS Puchar Polski",
        description:
            "Start Strefy STS Puchar Polski w Kolonii Pasjonatów.",
        type: "event"
    },

    {
        start: "2026-08-12",
        end: "2026-08-14",
        title: "Naprawa automoderacji",
        description:
            "Prace związane z naprawą automoderacji. Prace potrwają od 12.08.2026 do 14.08.2026.",
        type: "update"
    },

    {
        start: "2026-08-13",
        end: "2026-08-13",
        title: "Oficjalny start strony internetowej",
        description:
            "Oficjalny start strony internetowej Kolonii Pasjonatów.",
        type: "important"
    },

    {
        start: "2026-08-31",
        end: "2026-08-31",
        title: "Koniec Strefy Wakacyjnej",
        description:
            "O godzinie 23:45 nastąpi zakończenie Strefy Wakacyjnej.",
        type: "event"
    },

    {
        start: "2026-09-23",
        end: "2026-10-09",
        title: "Kolej w jesiennym krajobrazie",
        description:
            "Wydarzenie „Kolej w jesiennym krajobrazie” potrwa od 23.09.2026 do 09.10.2026.",
        type: "event"
    },

    {
        start: "2026-10-10",
        end: "2026-10-18",
        title: "Jesienny Spotter",
        description:
            "Mały konkurs ze skromną nagrodą. Konkurs potrwa od 10.10.2026 do 18.10.2026.",
        type: "special"
    },

    {
        start: "2026-10-31",
        end: "2026-10-31",
        title: "Halloween Kolonii Pasjonatów",
        description:
            "Halloween w Kolonii Pasjonatów. 🎃",
        type: "special"
    },

    {
        start: "2027-06-11",
        end: "2027-06-11",
        title: "1. rocznica otwarcia naszej społeczności",
        description:
            "Pierwsza rocznica otwarcia naszej społeczności. 🎉",
        type: "important"
    }

];


const calendarDays =
    document.getElementById("calendarDays");

const monthTitle =
    document.getElementById("monthTitle");

const eventInfo =
    document.getElementById("eventInfo");

const eventType =
    document.getElementById("eventType");

const eventTitle =
    document.getElementById("eventTitle");

const eventDate =
    document.getElementById("eventDate");

const eventDescription =
    document.getElementById("eventDescription");

const previousMonth =
    document.getElementById("previousMonth");

const nextMonth =
    document.getElementById("nextMonth");

const todayButton =
    document.getElementById("todayButton");


const deviceToday = new Date();

const todayYear =
    deviceToday.getFullYear();

const todayMonth =
    deviceToday.getMonth();

const todayDay =
    deviceToday.getDate();


let currentDate =
    new Date(
        todayYear,
        todayMonth,
        1
    );


const monthNames = [
    "Styczeń",
    "Luty",
    "Marzec",
    "Kwiecień",
    "Maj",
    "Czerwiec",
    "Lipiec",
    "Sierpień",
    "Wrzesień",
    "Październik",
    "Listopad",
    "Grudzień"
];


function formatDate(year, month, day) {

    return (
        year +
        "-" +
        String(month + 1).padStart(2, "0") +
        "-" +
        String(day).padStart(2, "0")
    );

}


function getEventsForDate(dateString) {

    return events.filter(event => {

        return (
            dateString >= event.start &&
            dateString <= event.end
        );

    });

}


function formatPolishDate(dateString) {

    const parts =
        dateString.split("-");

    return (
        parts[2] +
        "." +
        parts[1] +
        "." +
        parts[0]
    );

}


function showEvent(event, dateString) {

    eventInfo.style.display =
        "block";

    eventTitle.textContent =
        event.title;

    eventDescription.textContent =
        event.description;

    eventDate.textContent =
        "📅 " +
        formatPolishDate(dateString);


    if (event.type === "important") {

        eventType.textContent =
            "🔴 Ważne";

    }

    else if (event.type === "special") {

        eventType.textContent =
            "🟣 Specjalne";

    }

    else if (event.type === "update") {

        eventType.textContent =
            "🔵 Aktualizacja";

    }

    else {

        eventType.textContent =
            "🟡 Wydarzenie";

    }


    eventInfo.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });

}


function renderCalendar() {

    calendarDays.innerHTML = "";

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();


    monthTitle.textContent =
        monthNames[month] +
        " " +
        year;


    let firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    firstDay =
        firstDay === 0
            ? 6
            : firstDay - 1;


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const emptyDay =
            document.createElement("div");

        emptyDay.className =
            "day empty";

        calendarDays.appendChild(
            emptyDay
        );

    }


    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const dayElement =
            document.createElement("div");

        dayElement.className =
            "day";


        const dateString =
            formatDate(
                year,
                month,
                day
            );


        const dayNumber =
            document.createElement("div");

        dayNumber.className =
            "day-number";

        dayNumber.textContent =
            day;

        dayElement.appendChild(
            dayNumber
        );


        if (
            year === todayYear &&
            month === todayMonth &&
            day === todayDay
        ) {

            dayElement.classList.add(
                "today-day"
            );


            const todayLabel =
                document.createElement("div");

            todayLabel.className =
                "today-label";

            todayLabel.textContent =
                "DZISIAJ";

            dayElement.appendChild(
                todayLabel
            );

        }


        const dayEvents =
            getEventsForDate(
                dateString
            );


        dayEvents.forEach(event => {

            if (event.type === "special") {

                dayElement.classList.add(
                    "special-day"
                );

            }

            else if (event.type === "update") {

                dayElement.classList.add(
                    "event-day"
                );

            }

            else if (event.type === "important") {

                dayElement.classList.add(
                    "holiday-day"
                );

            }

            else {

                dayElement.classList.add(
                    "event-day"
                );

            }


            const dot =
                document.createElement("div");


            if (event.type === "special") {

                dot.className =
                    "special-dot";

            }

            else if (event.type === "important") {

                dot.className =
                    "holiday-dot";

            }

            else {

                dot.className =
                    "event-dot";

            }


            dayElement.appendChild(
                dot
            );

        });


        dayElement.addEventListener(
            "click",
            function () {

                const selectedEvents =
                    getEventsForDate(
                        dateString
                    );


                if (
                    selectedEvents.length > 0
                ) {

                    showEvent(
                        selectedEvents[0],
                        dateString
                    );

                }

                else {

                    eventInfo.style.display =
                        "none";

                }

            }
        );


        calendarDays.appendChild(
            dayElement
        );

    }

}


previousMonth.addEventListener(
    "click",
    function () {

        currentDate.setMonth(
            currentDate.getMonth() - 1
        );

        renderCalendar();

    }
);


nextMonth.addEventListener(
    "click",
    function () {

        currentDate.setMonth(
            currentDate.getMonth() + 1
        );

        renderCalendar();

    }
);


todayButton.addEventListener(
    "click",
    function () {

        currentDate =
            new Date(
                todayYear,
                todayMonth,
                1
            );

        renderCalendar();

    }
);


renderCalendar();

</script>


<script src="script.js"></script>

</body>

</html>
