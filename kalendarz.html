<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalendarz | Kolonia Pasjonatów</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .calendar-page {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .home-button,
        .theme-button,
        .month-button {
            border: none;
            border-radius: 14px;
            padding: 12px 18px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            transition: .2s;
        }

        .home-button:hover,
        .theme-button:hover,
        .month-button:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0;
            gap: 15px;
        }

        .month-title {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
        }

        .calendar {
            padding: 20px;
            border-radius: 22px;
            background: rgba(255,255,255,.06);
        }

        .weekdays,
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .weekday {
            text-align: center;
            font-weight: 800;
            padding: 10px;
        }

        .day {
            min-height: 80px;
            padding: 9px;
            border-radius: 14px;
            cursor: pointer;
            background: rgba(255,255,255,.05);
            transition: .2s;
        }

        .day:hover {
            transform: translateY(-3px);
            filter: brightness(1.15);
        }

        .day.empty {
            opacity: 0;
            cursor: default;
        }

        .day-number {
            font-weight: 800;
        }

        /* WYDARZENIE KOLONII */

        .event-day {
            box-shadow:
                0 0 0 2px rgba(255,193,7,.75),
                0 0 14px rgba(255,193,7,.18);
        }

        .event-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ffc107;
            margin-top: 9px;
        }

        /* ŚWIĘTO */

        .holiday-day {
            box-shadow:
                0 0 0 2px rgba(220,40,40,.75);
        }

        .holiday-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #e63946;
            margin-top: 9px;
        }

        /* URODZINY */

        .birthday-day {
            box-shadow:
                0 0 0 2px rgba(255,105,180,.75);
        }

        .birthday-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ff69b4;
            margin-top: 9px;
        }

        /* SYLWESTER */

        .special-day {
            box-shadow:
                0 0 0 2px rgba(130,80,255,.75);
        }

        .special-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #8250ff;
            margin-top: 9px;
        }

        /* INFORMACJE */

        .event-info {
            margin-top: 25px;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255,255,255,.07);
            display: none;
            animation: showEvent .25s ease;
        }

        .event-info.active {
            display: block;
        }

        .event-info h2 {
            margin-top: 0;
        }

        .event-date {
            font-weight: 700;
            opacity: .75;
            margin-bottom: 10px;
        }

        .event-type {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 700;
        }

        .type-event {
            background: rgba(255,193,7,.2);
        }

        .type-holiday {
            background: rgba(220,40,40,.2);
        }

        .type-birthday {
            background: rgba(255,105,180,.2);
        }

        .type-special {
            background: rgba(130,80,255,.2);
        }

        @keyframes showEvent {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* LEGENDA */

        .legend {
            margin-top: 25px;
            padding: 18px;
            border-radius: 18px;
            background: rgba(255,255,255,.06);
        }

        .legend-items {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .legend-event {
            background: #ffc107;
        }

        .legend-holiday {
            background: #e63946;
        }

        .legend-birthday {
            background: #ff69b4;
        }

        .legend-special {
            background: #8250ff;
        }

        @media (max-width:600px) {

            .calendar-page {
                padding: 12px;
            }

            .home-button,
            .theme-button,
            .month-button {
                padding: 9px 12px;
                font-size: 14px;
            }

            .month-title {
                font-size: 21px;
            }

            .calendar {
                padding: 8px;
            }

            .weekdays,
            .days {
                gap: 4px;
            }

            .weekday {
                font-size: 11px;
                padding: 7px 2px;
            }

            .day {
                min-height: 55px;
                padding: 6px;
                font-size: 12px;
            }

            .legend-items {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

    <!-- LEGENDA -->

</main>

/* =====================================================
   KALENDARZ
===================================================== */

const monthNames = [
    "Styczeń",
    "Luty",
    "Marzec",
    "Kwiecień",
    "Maj",
    "Czerwiec",
    "Lipiec",
    "Sierpień",
    "Wrzesień",
    "Październik",
    "Listopad",
    "Grudzień"
];


let currentDate = new Date(2026, 7, 1);


const monthTitle =
    document.getElementById("monthTitle");

const calendarDays =
    document.getElementById("calendarDays");

const eventInfo =
    document.getElementById("eventInfo");

const eventType =
    document.getElementById("eventType");

const eventDate =
    document.getElementById("eventDate");

const eventTitle =
    document.getElementById("eventTitle");

const eventDescription =
    document.getElementById("eventDescription");


function renderCalendar() {

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();


    monthTitle.textContent =
        monthNames[month] + " " + year;


    calendarDays.innerHTML = "";


    const firstDay =
        new Date(year, month, 1);


    let startDay =
        firstDay.getDay();


    if (startDay === 0) {
        startDay = 7;
    }


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for (
        let i = 1;
        i < startDay;
        i++
    ) {

        const empty =
            document.createElement("div");

        empty.className =
            "day empty";

        calendarDays.appendChild(empty);

    }


    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const cell =
            document.createElement("div");

        cell.className = "day";


        const number =
            document.createElement("div");

        number.className =
            "day-number";

        number.textContent =
            day;

        cell.appendChild(number);


        const monthNumber =
            String(month + 1)
            .padStart(2, "0");


        const dayNumber =
            String(day)
            .padStart(2, "0");


        const dateKey =
            `${year}-${monthNumber}-${dayNumber}`;


        if (events[dateKey]) {

            const event =
                events[dateKey];


            cell.classList.add(
                event.type + "-day"
            );


            const dot =
                document.createElement("div");


            dot.className =
                event.type + "-dot";


            cell.appendChild(dot);


            cell.addEventListener(
                "click",
                () => {

                    eventType.textContent =
                        event.typeName;


                    eventType.className =
                        "event-type type-" +
                        event.type;


                    eventDate.textContent =
                        `📅 ${day}.${monthNumber}.${year}` +
                        (
                            event.time
                                ? ` | ⏰ ${event.time}`
                                : ""
                        );


                    eventTitle.textContent =
                        event.title;


                    eventDescription.textContent =
                        event.description;


                    eventInfo.classList.add(
                        "active"
                    );


                    eventInfo.scrollIntoView({
                        behavior: "smooth",
                        block: "nearest"
                    });

                }
            );

        }


        calendarDays.appendChild(cell);

    }

}


/* =====================================================
   ZMIANA MIESIĄCA
===================================================== */

document
    .getElementById("previousMonth")
    .addEventListener(
        "click",
        () => {

            currentDate.setMonth(
                currentDate.getMonth() - 1
            );

            renderCalendar();

            eventInfo.classList.remove(
                "active"
            );

        }
    );


document
    .getElementById("nextMonth")
    .addEventListener(
        "click",
        () => {

            currentDate.setMonth(
                currentDate.getMonth() + 1
            );

            renderCalendar();

            eventInfo.classList.remove(
                "active"
            );

        }
    );


/* =====================================================
   TRYB JASNY / CIEMNY
===================================================== */

const themeButton =
    document.getElementById(
        "themeButton"
    );


const savedTheme =
    localStorage.getItem(
        "theme"
    );


if (savedTheme === "light") {

    document.body.classList.add(
        "light"
    );

    themeButton.textContent =
        "☀️";

}


themeButton.addEventListener(
    "click",
    () => {

        document.body.classList.toggle(
            "light"
        );


        if (
            document.body.classList.contains(
                "light"
            )
        ) {

            localStorage.setItem(
                "theme",
                "light"
            );

            themeButton.textContent =
                "☀️";

        } else {

            localStorage.setItem(
                "theme",
                "dark"
            );

            themeButton.textContent =
                "🌙";

        }

    }
);


/* START */

renderCalendar();

</script>
