<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kalendarz | Kolonia Pasjonatów</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           KALENDARZ — NOWA WERSJA
        ===================================================== */

        .calendar-page {

            width:
                min(
                    calc(100% - 36px),
                    1100px
                );

            margin:
                0 auto;

            padding:
                60px 0 90px;
        }


        /* =====================================================
           HERO
        ===================================================== */

        .calendar-hero {

            padding:
                80px 25px;

            text-align:
                center;

            background:

                radial-gradient(
                    circle at 50% 0%,
                    rgba(229, 85, 108, 0.18),
                    transparent 60%
                ),

                var(--bg-secondary);

            border-bottom:
                1px solid var(--border);
        }

        .calendar-hero h1 {

            margin-bottom:
                12px;

            color:
                var(--text-main);

            font-size:
                clamp(2.5rem, 6vw, 5rem);

            line-height:
                1;

            font-weight:
                900;

            letter-spacing:
                -3px;
        }

        .calendar-hero p {

            max-width:
                650px;

            margin:
                0 auto;

            color:
                var(--text-secondary);

            font-size:
                1rem;
        }


        /* =====================================================
           NAWIGACJA MIESIĄCA
        ===================================================== */

        .calendar-navigation {

            display:
                grid;

            grid-template-columns:
                auto 1fr auto;

            align-items:
                center;

            gap:
                15px;

            margin-bottom:
                15px;
        }

        .calendar-navigation .button {

            white-space:
                nowrap;
        }

        .month-title {

            text-align:
                center;

            color:
                var(--text-main);

            font-size:
                clamp(1.5rem, 4vw, 2.2rem);

            font-weight:
                900;
        }


        /* =====================================================
           DZISIAJ
        ===================================================== */

        .today-button-wrapper {

            display:
                flex;

            justify-content:
                center;

            margin-bottom:
                22px;
        }

        .today-button {

            min-height:
                42px;
        }


        /* =====================================================
           KARTA KALENDARZA
        ===================================================== */

        .calendar {

            width:
                100%;

            padding:
                18px;

            background:
                var(--bg-card);

            border:
                1px solid var(--border);

            border-radius:
                var(--radius);

            box-shadow:
                var(--shadow);
        }


        /* =====================================================
           DNI TYGODNIA
        ===================================================== */

        .weekdays {

            display:
                grid;

            grid-template-columns:
                repeat(7, minmax(0, 1fr));

            gap:
                7px;

            margin-bottom:
                7px;
        }

        .weekday {

            padding:
                10px 4px;

            text-align:
                center;

            color:
                var(--accent);

            font-size:
                0.78rem;

            font-weight:
                900;

            text-transform:
                uppercase;
        }


        /* =====================================================
           DNI
        ===================================================== */

        .days {

            display:
                grid;

            grid-template-columns:
                repeat(7, minmax(0, 1fr));

            gap:
                7px;
        }


        /* =====================================================
           POJEDYNCZY DZIEŃ
        ===================================================== */

        .day {

            position:
                relative;

            min-width:
                0;

            min-height:
                105px;

            padding:
                10px;

            overflow:
                hidden;

            cursor:
                pointer;

            background:
                var(--bg-secondary);

            border:
                1px solid var(--border);

            border-radius:
                12px;

            color:
                var(--text-secondary);

            transition:
                transform var(--transition),
                border-color var(--transition),
                background var(--transition),
                box-shadow var(--transition);
        }

        .day:hover {

            transform:
                translateY(-3px);

            border-color:
                rgba(229, 85, 108, 0.4);

            box-shadow:
                var(--shadow-small);
        }

        .day.empty {

            min-height:
                105px;

            cursor:
                default;

            background:
                transparent;

            border-color:
                transparent;

            box-shadow:
                none;
        }

        .day.empty:hover {

            transform:
                none;

            border-color:
                transparent;

            box-shadow:
                none;
        }


        /* =====================================================
           NUMER DNIA
        ===================================================== */

        .day-number {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            width:
                30px;

            height:
                30px;

            margin-bottom:
                5px;

            border-radius:
                50%;

            color:
                var(--text-main);

            font-size:
                0.9rem;

            font-weight:
                900;
        }


        /* =====================================================
           DZISIAJ
        ===================================================== */

        .today-day {

            border-color:
                var(--accent);

            box-shadow:
                0 0 0 1px
                rgba(229, 85, 108, 0.18);

            background:
                rgba(229, 85, 108, 0.08);
        }

        .today-day .day-number {

            background:
                var(--accent);

            color:
                #fff;
        }

        .today-label {

            position:
                absolute;

            top:
                8px;

            right:
                8px;

            color:
                var(--accent);

            font-size:
                0.58rem;

            font-weight:
                900;

            letter-spacing:
                0.5px;
        }


        /* =====================================================
           OZNACZENIA WYDARZEŃ
        ===================================================== */

        .event-marker {

            display:
                flex;

            align-items:
                center;

            gap:
                6px;

            width:
                100%;

            margin-top:
                5px;

            padding:
                5px 6px;

            border-radius:
                7px;

            font-size:
                0.68rem;

            font-weight:
                750;

            line-height:
                1.25;

            overflow-wrap:
                anywhere;
        }


        .event-marker.event {

            background:
                rgba(229, 85, 108, 0.13);

            color:
                var(--accent);
        }


        .event-marker.update {

            background:
                rgba(93, 169, 255, 0.13);

            color:
                var(--info);
        }


        .event-marker.important {

            background:
                rgba(240, 185, 90, 0.14);

            color:
                var(--warning);
        }


        .event-marker.special {

            background:
                rgba(170, 100, 255, 0.14);

            color:
                #b87cff;
        }


        /* =====================================================
           URODZINY
        ===================================================== */

        .day.birthday-day {

            border-color:
                rgba(255, 145, 65, 0.65);

            background:
                rgba(255, 145, 65, 0.07);
        }

        .birthday-marker {

            display:
                flex;

            align-items:
                center;

            gap:
                5px;

            width:
                100%;

            margin-top:
                5px;

            padding:
                5px 6px;

            border-radius:
                7px;

            background:
                rgba(255, 145, 65, 0.16);

            color:
                #ff9b4a;

            font-size:
                0.68rem;

            font-weight:
                800;

            line-height:
                1.25;

            overflow-wrap:
                anywhere;
        }


        /* =====================================================
           INFORMACJA O WYDARZENIU
        ===================================================== */

        .event-info {

            margin-top:
                22px;

            padding:
                28px;

            background:
                var(--bg-card);

            border:
                1px solid var(--border);

            border-left:
                4px solid var(--accent);

            border-radius:
                var(--radius);

            box-shadow:
                var(--shadow-small);

            animation:
                fadeUp 0.3s ease both;
        }

        .event-type {

            display:
                inline-flex;

            margin-bottom:
                10px;

            padding:
                6px 10px;

            border-radius:
                999px;

            background:
                rgba(229, 85, 108, 0.1);

            color:
                var(--accent);

            font-size:
                0.72rem;

            font-weight:
                900;
        }

        .event-info.birthday-info {

            border-left-color:
                #ff9141;
        }

        .event-info.birthday-info .event-type {

            background:
                rgba(255, 145, 65, 0.12);

            color:
                #ff9141;
        }

        .event-info h3 {

            margin-bottom:
                8px;

            color:
                var(--text-main);

            font-size:
                1.35rem;
        }

        .event-date {

            margin-bottom:
                12px;

            color:
                var(--text-muted);

            font-size:
                0.82rem;

            font-weight:
                700;
        }

        .event-info p {

            color:
                var(--text-secondary);

            line-height:
                1.7;
        }


        /* =====================================================
           LEGENDA
        ===================================================== */

        .legend {

            margin-top:
                22px;

            padding:
                25px;

            background:
                var(--bg-card);

            border:
                1px solid var(--border);

            border-radius:
                var(--radius);

            box-shadow:
                var(--shadow-small);
        }

        .legend h3 {

            margin-bottom:
                18px;

            color:
                var(--text-main);

            font-size:
                1.1rem;
        }

        .legend-items {

            display:
                grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap:
                12px;
        }

        .legend-item {

            display:
                flex;

            align-items:
                center;

            gap:
                9px;

            color:
                var(--text-secondary);

            font-size:
                0.88rem;

            font-weight:
                700;
        }

        .legend-color {

            width:
                14px;

            height:
                14px;

            flex-shrink:
                0;

            border-radius:
                4px;
        }

        .legend-event {

            background:
                var(--accent);
        }

        .legend-holiday {

            background:
                var(--warning);
        }

        .legend-special {

            background:
                #b87cff;
        }

        .legend-today {

            background:
                var(--accent);

            border:
                2px solid
                rgba(229, 85, 108, 0.35);
        }

        .legend-birthday {

            background:
                #ff9141;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 760px) {

            .calendar-page {

                width:
                    calc(100% - 24px);

                padding:
                    35px 0 60px;
            }

            .calendar-hero {

                padding:
                    55px 20px;
            }

            .calendar-hero h1 {

                font-size:
                    2.8rem;

                letter-spacing:
                    -2px;
            }

            .calendar-navigation {

                grid-template-columns:
                    1fr 1fr;

                gap:
                    8px;
            }

            .month-title {

                grid-column:
                    1 / -1;

                grid-row:
                    1;

                font-size:
                    1.55rem;

                margin-bottom:
                    4px;
            }

            .calendar-navigation .button {

                width:
                    100%;

                min-height:
                    44px;

                padding:
                    9px 7px;

                font-size:
                    0.78rem;
            }

            .calendar {

                padding:
                    8px;

                border-radius:
                    14px;
            }

            .weekdays,
            .days {

                gap:
                    3px;
            }

            .weekday {

                padding:
                    7px 1px;

                font-size:
                    0.6rem;
            }

            .day {

                min-height:
                    72px;

                padding:
                    5px;

                border-radius:
                    8px;
            }

            .day.empty {

                min-height:
                    72px;
            }

            .day-number {

                width:
                    25px;

                height:
                    25px;

                font-size:
                    0.75rem;
            }

            .today-label {

                display:
                    none;
            }

            .event-marker,
            .birthday-marker {

                padding:
                    3px 4px;

                margin-top:
                    3px;

                font-size:
                    0.52rem;

                line-height:
                    1.15;
            }

            .event-info {

                padding:
                    20px;
            }

            .legend {

                padding:
                    20px;
            }

            .legend-items {

                grid-template-columns:
                    1fr;
            }
        }


        /* =====================================================
           BARDZO MAŁY TELEFON
        ===================================================== */

        @media (max-width: 420px) {

            .calendar-page {

                width:
                    calc(100% - 14px);
            }

            .calendar {

                padding:
                    5px;
            }

            .weekday {

                font-size:
                    0.52rem;
            }

            .day {

                min-height:
                    60px;

                padding:
                    4px;
            }

            .day.empty {

                min-height:
                    60px;
            }

            .day-number {

                width:
                    22px;

                height:
                    22px;

                font-size:
                    0.68rem;
            }

            .event-marker,
            .birthday-marker {

                font-size:
                    0.45rem;

                padding:
                    2px 3px;
            }
        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        🌟 Kolonia Pasjonatów
    </div>


    <a
        href="index.html"
        class="button button-secondary home-button"
    >
        🏠 Strona główna
    </a>


    <button
        id="themeToggle"
        class="theme-toggle"
        type="button"
        aria-label="Zmień motyw"
    >
        ☀️
    </button>

</header>



<main>


    <!-- =====================================================
         HERO
    ====================================================== -->

    <section class="calendar-hero">

        <h1>
            📅 Kalendarz
        </h1>

        <p>
            Najważniejsze wydarzenia, terminy
            i urodziny członków Kolonii Pasjonatów.
        </p>

    </section>



    <!-- =====================================================
         KALENDARZ
    ====================================================== -->

    <section class="calendar-page">


        <!-- NAWIGACJA -->

        <div class="calendar-navigation">

            <button
                class="button button-secondary"
                id="previousMonth"
                type="button"
            >
                ◀ Poprzedni
            </button>


            <div
                class="month-title"
                id="monthTitle"
            >
            </div>


            <button
                class="button button-secondary"
                id="nextMonth"
                type="button"
            >
                Następny ▶
            </button>

        </div>



        <!-- DZISIAJ -->

        <div class="today-button-wrapper">

            <button
                class="button button-primary today-button"
                id="todayButton"
                type="button"
            >
                📅 Dzisiaj
            </button>

        </div>



        <!-- KALENDARZ -->

        <div class="calendar">


            <div class="weekdays">

                <div class="weekday">Pon</div>
                <div class="weekday">Wt</div>
                <div class="weekday">Śr</div>
                <div class="weekday">Czw</div>
                <div class="weekday">Pt</div>
                <div class="weekday">Sob</div>
                <div class="weekday">Nd</div>

            </div>


            <div
                class="days"
                id="calendarDays"
            >
            </div>


        </div>



        <!-- =================================================
             INFORMACJA O WYDARZENIU
        ================================================== -->

        <div
            class="event-info"
            id="eventInfo"
            style="display:none;"
        >

            <span
                class="event-type"
                id="eventType"
            >
            </span>


            <h3 id="eventTitle">
            </h3>


            <div
                class="event-date"
                id="eventDate"
            >
            </div>


            <p id="eventDescription">
            </p>

        </div>



        <!-- =================================================
             LEGENDA
        ================================================== -->

        <div class="legend">

            <h3>
                📌 Legenda
            </h3>


            <div class="legend-items">

                <div class="legend-item">

                    <span
                        class="legend-color legend-event"
                    ></span>

                    🟡 Wydarzenie

                </div>


                <div class="legend-item">

                    <span
                        class="legend-color legend-holiday"
                    ></span>

                    🟠 Ważne wydarzenie

                </div>


                <div class="legend-item">

                    <span
                        class="legend-color legend-special"
                    ></span>

                    🟣 Wydarzenie specjalne

                </div>


                <div class="legend-item">

                    <span
                        class="legend-color legend-today"
                    ></span>

                    🔴 Dzisiaj

                </div>


                <div class="legend-item">

                    <span
                        class="legend-color legend-birthday"
                    ></span>

                    🎂 Urodziny

                </div>

            </div>

        </div>


    </section>


</main>



<!-- =====================================================
     STOPKA
====================================================== -->

<footer>

    <div class="footer-bottom">

        <p>
            © 2026 Kolonia Pasjonatów
        </p>

        <p>
            🌟 Oficjalna strona społeczności
        </p>

    </div>

</footer>



<!-- =====================================================
     KALENDARZ — JAVASCRIPT
====================================================== -->

<script>


/* =========================================================
   WYDARZENIA
========================================================= */

const events = [

    {
        start: "2026-08-10",
        end: "2026-08-10",

        title:
            "Start Strefy STS Puchar Polski",

        description:
            "Start Strefy STS Puchar Polski w Kolonii Pasjonatów.",

        type:
            "event"
    },


    {

        end: "2026-08-14",

        title:
            "Naprawa automoderacji",

        description:
            "Prace związane z naprawą automoderacji. Prace potrwają od 12.08.2026 do 14.08.2026.",

        type:
            "update"
    },


    {
        start: "2026-08-13",
        end: "2026-08-13",

        title:
            "Oficjalny start strony internetowej",

        description:
            "Oficjalny start strony internetowej Kolonii Pasjonatów.",

        type:
            "important"
    },


    {
        start: "2026-08-31",
        end: "2026-08-31",

        title:
            "Koniec Strefy Wakacyjnej",

        description:
            "O godzinie 23:45 nastąpi zakończenie Strefy Wakacyjnej.",

        type:
            "event"
    },


    {
        start: "2026-09-23",
        end: "2026-10-09",

        title:
            "Kolej w jesiennym krajobrazie",

        description:
            "Wydarzenie „Kolej w jesiennym krajobrazie” potrwa od 23.09.2026 do 09.10.2026.",

        type:
            "event"
    },


    {
        start: "2026-10-10",
        end: "2026-10-18",

        title:
            "Jesienny Spotter",

        description:
            "Mały konkurs ze skromną nagrodą. Konkurs potrwa od 10.10.2026 do 18.10.2026.",

        type:
            "special"
    },


    {
        start: "2026-10-31",
        end: "2026-10-31",

        title:
            "Halloween Kolonii Pasjonatów",

        description:
            "Halloween w Kolonii Pasjonatów. 🎃",

        type:
            "special"
    },


    {
        start: "2027-06-11",
        end: "2027-06-11",

        title:
            "1. rocznica otwarcia naszej społeczności",

        description:
            "Pierwsza rocznica otwarcia naszej społeczności. 🎉",

        type:
            "important"
    }

];



/* =========================================================
   URODZINY — CYKLICZNE CO ROKU
========================================================= */

const birthdays = [

    {
        month: 8,
        day: 4,
        name: "Michał"
    },


    {
        month: 12,
        day: 23,
        name: "Mikol Yoriichi"
    },


    {
        month: 6,
        day: 25,
        name: "Noworudzki_mk2"
    },


    {
        month: 2,
        day: 4,
        name: "KEBABKRAFTOWY"
    },


    {
        month: 6,
        day: 2,
        name: "kubixtranspotter"
    }

];



/*
    month:
    1 = styczeń
    2 = luty
    ...
    12 = grudzień

    Dzięki temu urodziny nie mają przypisanego roku.
    Kalendarz pokazuje je automatycznie każdego roku.
*/



/* =========================================================
   ELEMENTY HTML
========================================================= */

const calendarDays =
    document.getElementById(
        "calendarDays"
    );


const monthTitle =
    document.getElementById(
        "monthTitle"
    );


const eventInfo =
    document.getElementById(
        "eventInfo"
    );


const eventType =
    document.getElementById(
        "eventType"
    );


const eventTitle =
    document.getElementById(
        "eventTitle"
    );


const eventDate =
    document.getElementById(
        "eventDate"
    );


const eventDescription =
    document.getElementById(
        "eventDescription"
    );


const previousMonth =
    document.getElementById(
        "previousMonth"
    );


const nextMonth =
    document.getElementById(
        "nextMonth"
    );


const todayButton =
    document.getElementById(
        "todayButton"
    );



/* =========================================================
   DZISIAJ
========================================================= */

const today =
    new Date();


const todayYear =
    today.getFullYear();


const todayMonth =
    today.getMonth();


const todayDay =
    today.getDate();



let currentDate =
    new Date(
        todayYear,
        todayMonth,
        1
    );



/* =========================================================
   NAZWY MIESIĘCY
========================================================= */

const monthNames = [

    "Styczeń",
    "Luty",
    "Marzec",
    "Kwiecień",
    "Maj",
    "Czerwiec",
    "Lipiec",
    "Sierpień",
    "Wrzesień",
    "Październik",
    "Listopad",
    "Grudzień"

];



/* =========================================================
   FORMAT DATY
========================================================= */

function formatDate(
    year,
    month,
    day
) {

    return (

        year +

        "-" +

        String(
            month + 1
        ).padStart(
            2,
            "0"
        ) +

        "-" +

        String(
            day
        ).padStart(
            2,
            "0"
        )

    );

}



/* =========================================================
   WYDARZENIA DLA KONKRETNEGO DNIA
========================================================= */

function getEventsForDate(
    dateString
) {

    return events.filter(
        event =>

            dateString >= event.start &&
            dateString <= event.end
    );

}



/* =========================================================
   URODZINY DLA KONKRETNEGO DNIA
========================================================= */

function getBirthdaysForDate(
    year,
    month,
    day
) {

    return birthdays.filter(
        birthday =>

            birthday.month === month + 1 &&
            birthday.day === day
    );

}



/* =========================================================
   FORMAT DATY PO POLSKU
========================================================= */

function formatPolishDate(
    dateString
) {

    const parts =
        dateString.split("-");


    return (

        parts[2] +
        "." +
        parts[1] +
        "." +
        parts[0]

    );

}



/* =========================================================
   POKAZANIE URODZIN
========================================================= */

function showBirthday(
    birthday,
    dateString
) {

    eventInfo.style.display =
        "block";


    eventInfo.classList.add(
        "birthday-info"
    );


    eventType.textContent =
        "🎂 Urodziny";


    eventTitle.textContent =
        "🎂 Urodziny — " +
        birthday.name;


    eventDate.textContent =
        "📅 " +
        formatPolishDate(
            dateString
        );


    eventDescription.textContent =
        "Dzisiaj urodziny obchodzi " +
        birthday.name +
        "! 🎉 Wszystkiego najlepszego! 🎂";


    eventInfo.scrollIntoView({
        behavior:
            "smooth",

        block:
            "nearest"
    });

}



/* =========================================================
   POKAZANIE WYDARZENIA
========================================================= */

function showEvent(
    event,
    dateString
) {

    eventInfo.style.display =
        "block";


    eventInfo.classList.remove(
        "birthday-info"
    );


    eventTitle.textContent =
        event.title;


    eventDescription.textContent =
        event.description;


    eventDate.textContent =
        "📅 " +
        formatPolishDate(
            dateString
        );


    if (
        event.type ===
        "important"
    ) {

        eventType.textContent =
            "🟠 Ważne wydarzenie";

    }

    else if (
        event.type ===
        "special"
    ) {

        eventType.textContent =
            "🟣 Wydarzenie specjalne";

    }

    else if (
        event.type ===
        "update"
    ) {

        eventType.textContent =
            "🔵 Aktualizacja";

    }

    else {

        eventType.textContent =
            "🟡 Wydarzenie";

    }


    eventInfo.scrollIntoView({
        behavior:
            "smooth",

        block:
            "nearest"
    });

}



/* =========================================================
   RENDEROWANIE KALENDARZA
========================================================= */

function renderCalendar() {


    calendarDays.innerHTML =
        "";


    const year =
        currentDate.getFullYear();


    const month =
        currentDate.getMonth();


    monthTitle.textContent =

        monthNames[month] +
        " " +
        year;



    /*
       getDay():
       0 = niedziela
       1 = poniedziałek
       ...
       6 = sobota

       Przesuwamy wynik tak,
       aby poniedziałek był pierwszym dniem.
    */

    let firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    firstDay =
        firstDay === 0
            ? 6
            : firstDay - 1;



    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();



    /* =====================================================
       PUSTE POLA
    ===================================================== */

    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const emptyDay =
            document.createElement(
                "div"
            );


        emptyDay.className =
            "day empty";


        calendarDays.appendChild(
            emptyDay
        );

    }



    /* =====================================================
       DNI MIESIĄCA
    ===================================================== */

    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {


        const dayElement =
            document.createElement(
                "div"
            );


        dayElement.className =
            "day";



        const dateString =
            formatDate(
                year,
                month,
                day
            );



        /* NUMER DNIA */

        const dayNumber =
            document.createElement(
                "div"
            );


        dayNumber.className =
            "day-number";


        dayNumber.textContent =
            day;


        dayElement.appendChild(
            dayNumber
        );



        /* =================================================
           DZISIAJ
        ================================================= */

        if (

            year === todayYear &&
            month === todayMonth &&
            day === todayDay

        ) {

            dayElement.classList.add(
                "today-day"
            );


            const todayLabel =
                document.createElement(
                    "div"
                );


            todayLabel.className =
                "today-label";


            todayLabel.textContent =
                "DZISIAJ";


            dayElement.appendChild(
                todayLabel
            );

        }



        /* =================================================
           WYDARZENIA
        ================================================= */

        const dayEvents =
            getEventsForDate(
                dateString
            );


        dayEvents.forEach(
            event => {


                const marker =
                    document.createElement(
                        "div"
                    );


                marker.className =
                    "event-marker " +
                    event.type;


                let icon =
                    "🟡";


                if (
                    event.type ===
                    "update"
                ) {

                    icon =
                        "🔵";

                }

                else if (
                    event.type ===
                    "important"
                ) {

                    icon =
                        "🟠";

                }

                else if (
                    event.type ===
                    "special"
                ) {

                    icon =
                        "🟣";

                }


                marker.textContent =
                    icon +
                    " " +
                    event.title;


                dayElement.appendChild(
                    marker
                );

            }
        );



        /* =================================================
           URODZINY
        ================================================= */

        const dayBirthdays =
            getBirthdaysForDate(
                year,
                month,
                day
            );


        if (
            dayBirthdays.length > 0
        ) {

            dayElement.classList.add(
                "birthday-day"
            );


            dayBirthdays.forEach(
                birthday => {


                    const marker =
                        document.createElement(
                            "div"
                        );


                    marker.className =
                        "birthday-marker";


                    marker.textContent =
                        "🎂 " +
                        birthday.name;


                    dayElement.appendChild(
                        marker
                    );

                }
            );

        }



        /* =================================================
           KLIKNIĘCIE DNIA
        ================================================= */

        dayElement.addEventListener(
            "click",
            function () {


                const selectedEvents =
                    getEventsForDate(
                        dateString
                    );


                const selectedBirthdays =
                    getBirthdaysForDate(
                        year,
                        month,
                        day
                    );



                /* URODZINY MAJĄ PIERWSZEŃSTWO */

                if (
                    selectedBirthdays.length >
                    0
                ) {

                    showBirthday(
                        selectedBirthdays[0],
                        dateString
                    );


                    return;

                }



                /* WYDARZENIE */

                if (
                    selectedEvents.length >
                    0
                ) {

                    showEvent(
                        selectedEvents[0],
                        dateString
                    );


                    return;

                }



                /* BRAK WYDARZEŃ */

                eventInfo.style.display =
                    "none";


                eventInfo.classList.remove(
                    "birthday-info"
                );

            }
        );



        calendarDays.appendChild(
            dayElement
        );

    }

}



/* =========================================================
   POPRZEDNI MIESIĄC
========================================================= */

previousMonth.addEventListener(
    "click",
    function () {

        currentDate.setMonth(
            currentDate.getMonth() - 1
        );


        renderCalendar();

    }
);



/* =========================================================
   NASTĘPNY MIESIĄC
========================================================= */

nextMonth.addEventListener(
    "click",
    function () {

        currentDate.setMonth(
            currentDate.getMonth() + 1
        );


        renderCalendar();

    }
);



/* =========================================================
   DZISIAJ
========================================================= */

todayButton.addEventListener(
    "click",
    function () {


        currentDate =
            new Date(
                todayYear,
                todayMonth,
                1
            );


        eventInfo.style.display =
            "none";


        eventInfo.classList.remove(
            "birthday-info"
        );


        renderCalendar();

    }
);



/* =========================================================
   START
========================================================= */

renderCalendar();

</script>
