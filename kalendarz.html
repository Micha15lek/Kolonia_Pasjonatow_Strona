<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kalendarz | Kolonia Pasjonatów</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =====================================================
           KALENDARZ
        ===================================================== */

        .calendar-page {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }


        /* =====================================================
           GÓRNY PASEK
        ===================================================== */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }


        .home-button,
        .theme-button,
        .month-button,
        .today-button {

            border: none;
            border-radius: 14px;
            padding: 12px 18px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            transition: .25s;

        }


        .home-button:hover,
        .theme-button:hover,
        .month-button:hover,
        .today-button:hover {

            transform: translateY(-2px);
            filter: brightness(1.15);

        }


        /* =====================================================
           NAGŁÓWEK MIESIĄCA
        ===================================================== */

        .calendar-header {

            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0;
            gap: 15px;

        }


        .month-title {

            font-size: 28px;
            font-weight: 800;
            text-align: center;

        }


        .today-button {

            display: block;
            margin: 0 auto 20px;

        }


        /* =====================================================
           KALENDARZ
        ===================================================== */

        .calendar {

            padding: 20px;
            border-radius: 22px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.08);

        }


        .weekdays,
        .days {

            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;

        }


        .weekday {

            text-align: center;
            font-weight: 800;
            padding: 10px;

        }


        .day {

            min-height: 80px;
            padding: 9px;
            border-radius: 14px;
            cursor: pointer;
            background: rgba(255,255,255,.05);
            border: 1px solid transparent;
            transition: .25s;

        }


        .day:hover {

            transform: translateY(-3px);
            filter: brightness(1.15);

        }


        .day.empty {

            opacity: 0;
            cursor: default;

        }


        .day-number {

            font-weight: 800;

        }


        /* =====================================================
           DZISIAJ
        ===================================================== */

        .today-day {

            border: 2px solid rgba(80,180,255,.95);

            box-shadow:
                0 0 0 2px rgba(80,180,255,.15),
                0 0 20px rgba(80,180,255,.35);

        }


        .today-label {

            margin-top: 6px;
            font-size: 10px;
            font-weight: 900;
            color: #55b8ff;

        }


        /* =====================================================
           WYDARZENIE KOLONII
        ===================================================== */

        .event-day {

            box-shadow:
                0 0 0 2px rgba(255,193,7,.75),
                0 0 16px rgba(255,193,7,.20);

        }


        .event-dot {

            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ffc107;
            margin-top: 9px;

        }


        /* =====================================================
           ŚWIĘTO
        ===================================================== */

        .holiday-day {

            box-shadow:
                0 0 0 2px rgba(230,57,70,.75),
                0 0 16px rgba(230,57,70,.18);

        }


        .holiday-dot {

            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #e63946;
            margin-top: 9px;

        }


        /* =====================================================
           URODZINY
        ===================================================== */

        .birthday-day {

            box-shadow:
                0 0 0 2px rgba(255,105,180,.75),
                0 0 16px rgba(255,105,180,.18);

        }


        .birthday-dot {

            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ff69b4;
            margin-top: 9px;

        }


        /* =====================================================
           WYDARZENIE SPECJALNE
        ===================================================== */

        .special-day {

            box-shadow:
                0 0 0 2px rgba(130,80,255,.75),
                0 0 16px rgba(130,80,255,.18);

        }


        .special-dot {

            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #8250ff;
            margin-top: 9px;

        }


        /* =====================================================
           INFORMACJE O WYDARZENIU
        ===================================================== */

        .event-info {

            margin-top: 25px;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.08);
            display: none;
            animation: showEvent .25s ease;

        }


        .event-info.active {

            display: block;

        }


        .event-info h2 {

            margin-top: 0;

        }


        .event-date {

            font-weight: 700;
            opacity: .75;
            margin-bottom: 10px;

        }


        .event-type {

            display: inline-block;
            padding: 6px 10px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 700;

        }


        .type-event {

            background: rgba(255,193,7,.2);

        }


        .type-holiday {

            background: rgba(230,57,70,.2);

        }


        .type-birthday {

            background: rgba(255,105,180,.2);

        }


        .type-special {

            background: rgba(130,80,255,.2);

        }


        @keyframes showEvent {

            from {

                opacity: 0;
                transform: translateY(8px);

            }

            to {

                opacity: 1;
                transform: translateY(0);

            }

        }


        /* =====================================================
           LEGENDA
        ===================================================== */

        .legend {

            margin-top: 25px;
            padding: 18px;
            border-radius: 18px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.08);

        }


        .legend-items {

            display: flex;
            flex-wrap: wrap;
            gap: 15px;

        }


        .legend-item {

            display: flex;
            align-items: center;
            gap: 7px;

        }


        .legend-color {

            width: 12px;
            height: 12px;
            border-radius: 50%;

        }


        .legend-event {
            background: #ffc107;
        }


        .legend-holiday {
            background: #e63946;
        }


        .legend-birthday {
            background: #ff69b4;
        }


        .legend-special {
            background: #8250ff;
        }


        .legend-today {
            background: #55b8ff;
        }


        /* =====================================================
           INFORMACJA O BRAKU WYDARZEŃ
        ===================================================== */

        .no-events {

            margin-top: 20px;
            padding: 18px;
            border-radius: 16px;
            background: rgba(255,255,255,.05);
            opacity: .75;
            text-align: center;

        }


        /* =====================================================
           TELEFONY
        ===================================================== */

        @media (max-width:600px) {

            .calendar-page {
                padding: 12px;
            }


            .top-bar {
                flex-wrap: wrap;
            }


            .home-button,
            .theme-button,
            .month-button,
            .today-button {

                padding: 9px 12px;
                font-size: 14px;

            }


            .month-title {
                font-size: 21px;
            }


            .calendar {
                padding: 8px;
            }


            .weekdays,
            .days {
                gap: 4px;
            }


            .weekday {

                font-size: 11px;
                padding: 7px 2px;

            }


            .day {

                min-height: 60px;
                padding: 6px;
                font-size: 12px;

            }


            .today-label {
                font-size: 8px;
            }


            .legend-items {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<main class="calendar-page">


    <!-- =====================================================
         GÓRNY PASEK
    ===================================================== -->

    <div class="top-bar">

        <a
            href="index.html"
            class="home-button"
        >

            🏠 Strona główna

        </a>


        <button
            id="themeButton"
            class="theme-button"
            type="button"
        >

            🌙

        </button>

    </div>


    <!-- =====================================================
         HERO
    ===================================================== -->

    <section class="hero">

        <h1>
            📅 Kalendarz Kolonii Pasjonatów
        </h1>

        <p>

            Wydarzenia Kolonii, święta państwowe
            oraz urodziny członków społeczności.

        </p>

    </section>


    <!-- =====================================================
         DZISIAJ
    ===================================================== -->

    <button
        id="todayButton"
        class="today-button"
        type="button"
    >

        📍 Przejdź do dzisiaj

    </button>


    <!-- =====================================================
         MIESIĄC
    ===================================================== -->

    <div class="calendar-header">

        <button
            id="previousMonth"
            class="month-button"
            type="button"
        >

            ◀

        </button>


        <div
            id="monthTitle"
            class="month-title"
        ></div>


        <button
            id="nextMonth"
            class="month-button"
            type="button"
        >

            ▶

        </button>

    </div>


    <!-- =====================================================
         KALENDARZ
    ===================================================== -->

    <div class="calendar">

        <div class="weekdays">

            <div class="weekday">Pn</div>
            <div class="weekday">Wt</div>
            <div class="weekday">Śr</div>
            <div class="weekday">Cz</div>
            <div class="weekday">Pt</div>
            <div class="weekday">Sb</div>
            <div class="weekday">Nd</div>

        </div>


        <div
            id="calendarDays"
            class="days"
        ></div>

    </div>


    <!-- =====================================================
         LEGENDA
    ===================================================== -->

    <div class="legend">

        <h3>
            📌 Legenda
        </h3>


        <div class="legend-items">

            <div class="legend-item">

                <span
                    class="legend-color legend-event"
                ></span>

                🎉 Wydarzenie Kolonii

            </div>


            <div class="legend-item">

                <span
                    class="legend-color legend-holiday"
                ></span>

                🇵🇱 Święto państwowe

            </div>


            <div class="legend-item">

                <span
                    class="legend-color legend-birthday"
                ></span>

                🎂 Urodziny

            </div>


            <div class="legend-item">

                <span
                    class="legend-color legend-special"
                ></span>

                🎆 Wydarzenie specjalne

            </div>


            <div class="legend-item">

                <span
                    class="legend-color legend-today"
                ></span>

                📍 Dzisiaj

            </div>

        </div>

    </div>


    <!-- =====================================================
         INFORMACJE
    ===================================================== -->

    <div
        id="eventInfo"
        class="event-info"
    >

        <div
            id="eventType"
            class="event-type"
        ></div>


        <div
            id="eventDate"
            class="event-date"
        ></div>


        <h2
            id="eventTitle"
        ></h2>


        <p
            id="eventDescription"
        ></p>

    </div>


</main>


<!-- =====================================================
     DANE
     
     WAŻNE:
     dane.js musi znajdować się w tym samym folderze.
===================================================== -->

<script src="dane.js"></script>


<script>

/* =====================================================
   SPRAWDZENIE DANYCH
===================================================== */

const calendarData =
    typeof dane !== "undefined"
        ? dane
        : {};


/* =====================================================
   FUNKCJE POMOCNICZE
===================================================== */

function pad(number) {

    return String(number)
        .padStart(2, "0");

}


function dateKey(
    year,
    month,
    day
) {

    return `${year}-${pad(month + 1)}-${pad(day)}`;

}


/* =====================================================
   WIELKANOC
===================================================== */

function getEaster(year) {

    const a = year % 19;

    const b = Math.floor(year / 100);

    const c = year % 100;

    const d = Math.floor(b / 4);

    const e = b % 4;

    const f = Math.floor((b + 8) / 25);

    const g =
        Math.floor(
            (b - f + 1) / 3
        );

    const h =
        (
            19 * a +
            b -
            d -
            g +
            15
        ) % 30;

    const i =
        Math.floor(c / 4);

    const k =
        c % 4;

    const l =
        (
            32 +
            2 * e +
            2 * i -
            h -
            k
        ) % 7;

    const m =
        Math.floor(
            (
                a +
                11 * h +
                22 * l
            ) / 451
        );

    const month =
        Math.floor(
            (
                h +
                l -
                7 * m +
                114
            ) / 31
        );

    const day =
        (
            (
                h +
                l -
                7 * m +
                114
            ) % 31
        ) + 1;

    return new Date(
        year,
        month - 1,
        day
    );

}


/* =====================================================
   ŚWIĘTA
===================================================== */

function getHolidays(year) {

    const holidays = {};


    function add(
        month,
        day,
        title,
        description
    ) {

        holidays[
            dateKey(
                year,
                month - 1,
                day
            )
        ] = {

            title,
            description,

            type:
                "holiday",

            typeName:
                "🇵🇱 Święto państwowe"

        };

    }


    add(
        1,
        1,
        "🎆 Nowy Rok",
        "Pierwszy dzień nowego roku. Święto ustawowo wolne od pracy."
    );


    add(
        1,
        6,
        "✝️ Święto Trzech Króli",
        "Święto Objawienia Pańskiego. Dzień ustawowo wolny od pracy."
    );


    add(
        5,
        1,
        "🇵🇱 Święto Pracy",
        "Święto ustawowo wolne od pracy."
    );


    add(
        5,
        3,
        "🇵🇱 Święto Konstytucji 3 Maja",
        "Święto upamiętniające uchwalenie Konstytucji 3 maja 1791 roku."
    );


    add(
        8,
        15,
        "🇵🇱 Wniebowzięcie Najświętszej Maryi Panny / Święto Wojska Polskiego",
        "Święto ustawowo wolne od pracy."
    );


    add(
        11,
        1,
        "🕯️ Wszystkich Świętych",
        "Święto ustawowo wolne od pracy."
    );


    add(
        11,
        11,
        "🇵🇱 Narodowe Święto Niepodległości",
        "Święto upamiętniające odzyskanie przez Polskę niepodległości w 1918 roku."
    );


    add(
        12,
        24,
        "🎄 Wigilia Bożego Narodzenia",
        "Dzień ustawowo wolny od pracy."
    );


    add(
        12,
        25,
        "🎄 Pierwszy dzień Bożego Narodzenia",
        "Święto ustawowo wolne od pracy."
    );


    add(
        12,
        26,
        "🎄 Drugi dzień Bożego Narodzenia",
        "Święto ustawowo wolne od pracy."
    );


    const easter =
        getEaster(year);


    function addRelative(
        days,
        title,
        description
    ) {

        const date =
            new Date(easter);

        date.setDate(
            date.getDate() + days
        );


        holidays[
            dateKey(
                date.getFullYear(),
                date.getMonth(),
                date.getDate()
            )
        ] = {

            title,
            description,

            type:
                "holiday",

            typeName:
                "🇵🇱 Święto państwowe"

        };

    }


    addRelative(
        1,
        "🐣 Poniedziałek Wielkanocny",
        "Drugi dzień Świąt Wielkanocnych. Dzień ustawowo wolny od pracy."
    );


    addRelative(
        49,
        "✝️ Zielone Świątki",
        "Święto Zesłania Ducha Świętego."
    );


    addRelative(
        60,
        "✝️ Boże Ciało",
        "Uroczystość Najświętszego Ciała i Krwi Chrystusa. Dzień ustawowo wolny od pracy."
    );


    return holidays;

}


/* =====================================================
   URODZINY
===================================================== */

function getBirthdays(year) {

    const birthdays =

        calendarData.birthdays ||
        calendarData.urodziny ||
        {};


    const result = {};


    for (
        const birthday in birthdays
    ) {

        const key =
            `${year}-${birthday}`;

        result[key] = {

            ...birthdays[birthday],

            type:
                "birthday",

            typeName:
                "🎂 Urodziny"

        };

    }


    return result;

}


/* =====================================================
   WYDARZENIA KOLONII
   TYLKO 2026
===================================================== */

function getColonyEvents(year) {

    if (year !== 2026) {

        return {};

    }


    return (
        calendarData.colonyEvents2026 ||
        calendarData.wydarzenia2026 ||
        {}
    );

}


/* =====================================================
   EVENTY DLA ROKU
===================================================== */

function getEventsForYear(year) {

    const events = {};


    /* ŚWIĘTA */

    Object.assign(
        events,
        getHolidays(year)
    );


    /* URODZINY */

    Object.assign(
        events,
        getBirthdays(year)
    );


    /* WYDARZENIA KOLONII */

    const colonyEvents =
        getColonyEvents(year);


    for (
        const eventDate in colonyEvents
    ) {

        const key =
            `${year}-${eventDate}`;


        events[key] = {

            ...colonyEvents[eventDate]

        };

    }


    return events;

}


/* =====================================================
   POKAZANIE INFORMACJI
===================================================== */

function showEvent(
    event,
    day,
    month,
    year
) {

    eventType.textContent =
        event.typeName ||
        "📌 Informacja";


    eventType.className =
        "event-type type-" +
        (event.type || "event");


    eventDate.textContent =
        `📅 ${pad(day)}.${pad(month + 1)}.${year}` +
        (
            event.time
                ? ` | ⏰ ${event.time}`
                : ""
        );


    eventTitle.textContent =
        event.title ||
        "Wydarzenie";


    eventDescription.textContent =
        event.description ||
        "";


    eventInfo.classList.add(
        "active"
    );


    eventInfo.scrollIntoView({

        behavior:
            "smooth",

        block:
            "nearest"

    });

}


/* =====================================================
   ELEMENTY
===================================================== */

const monthNames = [

    "Styczeń",
    "Luty",
    "Marzec",
    "Kwiecień",
    "Maj",
    "Czerwiec",
    "Lipiec",
    "Sierpień",
    "Wrzesień",
    "Październik",
    "Listopad",
    "Grudzień"

];


const monthTitle =
    document.getElementById(
        "monthTitle"
    );


const calendarDays =
    document.getElementById(
        "calendarDays"
    );


const eventInfo =
    document.getElementById(
        "eventInfo"
    );


const eventType =
    document.getElementById(
        "eventType"
    );


const eventDate =
    document.getElementById(
        "eventDate"
    );


const eventTitle =
    document.getElementById(
        "eventTitle"
    );


const eventDescription =
    document.getElementById(
        "eventDescription"
    );


/* =====================================================
   DZISIAJ
===================================================== */

const deviceToday =
    new Date();


const todayYear =
    deviceToday.getFullYear();


const todayMonth =
    deviceToday.getMonth();


const todayDay =
    deviceToday.getDate();


/* =====================================================
   AKTUALNY MIESIĄC
===================================================== */

let currentDate =
    new Date(
        todayYear,
        todayMonth,
        1
    );


/* =====================================================
   RYSOWANIE
===================================================== */

function renderCalendar() {

    const year =
        currentDate.getFullYear();


    const month =
        currentDate.getMonth();


    const events =
        getEventsForYear(year);


    monthTitle.textContent =
        `${monthNames[month]} ${year}`;


    calendarDays.innerHTML =
        "";


    const firstDay =
        new Date(
            year,
            month,
            1
        );


    let startDay =
        firstDay.getDay();


    if (
        startDay === 0
    ) {

        startDay = 7;

    }


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    /* PUSTE POLA */

    for (
        let i = 1;
        i < startDay;
        i++
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "day empty";


        calendarDays.appendChild(
            empty
        );

    }


    let eventsInMonth = 0;


    /* DNI */

    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day";


        const number =
            document.createElement(
                "div"
            );


        number.className =
            "day-number";


        number.textContent =
            day;


        cell.appendChild(
            number
        );


        const key =
            dateKey(
                year,
                month,
                day
            );


        /* DZISIAJ */

        if (

            year === todayYear &&
            month === todayMonth &&
            day === todayDay

        ) {

            cell.classList.add(
                "today-day"
            );


            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "today-label";


            label.textContent =
                "Dzisiaj";


            cell.appendChild(
                label
            );

        }


        /* WYDARZENIE */

        if (
            events[key]
        ) {

            const event =
                events[key];


            eventsInMonth++;


            cell.classList.add(
                event.type + "-day"
            );


            const dot =
                document.createElement(
                    "div"
                );


            dot.className =
                event.type + "-dot";


            cell.appendChild(
                dot
            );


            cell.addEventListener(
                "click",
                () => {

                    showEvent(
                        event,
                        day,
                        month,
                        year
                    );

                }
            );

        }


        calendarDays.appendChild(
            cell
        );

    }


    /* =================================================
       INFORMACJA O BRAKU WYDARZEŃ
    ================================================= */

    const oldNoEvents =
        document.querySelector(
            ".no-events"
        );


    if (oldNoEvents) {

        oldNoEvents.remove();

    }


    if (
        eventsInMonth === 0
    ) {

        const noEvents =
            document.createElement(
                "div"
            );


        noEvents.className =
            "no-events";


        noEvents.textContent =
            "📭 Brak zapisanych wydarzeń w tym miesiącu.";


        document
            .querySelector(".calendar")
            .appendChild(
                noEvents
            );

    }

}


/* =====================================================
   POPRZEDNI MIESIĄC
===================================================== */

document
    .getElementById(
        "previousMonth"
    )
    .addEventListener(
        "click",
        () => {

            currentDate.setMonth(
                currentDate.getMonth() - 1
            );


            renderCalendar();


            eventInfo.classList.remove(
                "active"
            );

        }
    );


/* =====================================================
   NASTĘPNY MIESIĄC
===================================================== */

document
    .getElementById(
        "nextMonth"
    )
    .addEventListener(
        "click",
        () => {

            currentDate.setMonth(
                currentDate.getMonth() + 1
            );


            renderCalendar();


            eventInfo.classList.remove(
                "active"
            );

        }
    );


/* =====================================================
   DZISIAJ
===================================================== */

document
    .getElementById(
        "todayButton"
    )
    .addEventListener(
        "click",
        () => {

            currentDate =
                new Date(
                    todayYear,
                    todayMonth,
                    1
                );


            renderCalendar();


            eventInfo.classList.remove(
                "active"
            );

        }
    );


/* =====================================================
   TRYB CIEMNY / JASNY / RETRO
===================================================== */

const themeButton =
    document.getElementById(
        "themeButton"
    );


const savedTheme =
    localStorage.getItem(
        "theme"
    ) || "dark";


function applyTheme(theme) {

    document.body.classList.remove(
        "light",
        "retro"
    );


    if (
        theme === "light"
    ) {

        document.body.classList.add(
            "light"
        );


        themeButton.textContent =
            "☀️";


    } else if (
        theme === "retro"
    ) {

        document.body.classList.add(
            "retro"
        );


        themeButton.textContent =
            "💾";


    } else {

        themeButton.textContent =
            "🌙";

    }


    localStorage.setItem(
        "theme",
        theme
    );

}


applyTheme(
    savedTheme
);


themeButton.addEventListener(
    "click",
    () => {

        const current =
            localStorage.getItem(
                "theme"
            ) || "dark";


        if (
            current === "dark"
        ) {

            applyTheme(
                "light"
            );


        } else if (
            current === "light"
        ) {

            applyTheme(
                "retro"
            );


        } else {

            applyTheme(
                "dark"
            );

        }

    }
);


/* =====================================================
   START
===================================================== */

renderCalendar();

</script>


</body>
