<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Typowanie - Kolonia Pasjonatów</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- MENU STRONY -->

<nav class="menu">

<a href="index.html">🏠 Start</a>

<a href="typowanie.html">⚽ Typowanie</a>

<a href="ranking.html">📊 Ranking</a>

<a href="admin.html">🔐 Admin</a>

</nav>





<div class="container">


<h1>⚽ Typowanie meczów</h1>

<p>Kolonia Pasjonatów</p>





<!-- DANE UŻYTKOWNIKA -->

<div class="user-panel">


<h2>👤 Użytkownik Discord</h2>


<input 
id="username"
placeholder="Wpisz nazwę użytkownika Discord">



<h2>📅 Wybierz kolejkę</h2>


<select id="roundSelect" onchange="loadMatches()">

<option value="">
-- wybierz kolejkę --
</option>


<option value="Kolejka 2">
Kolejka 2
</option>


</select>





<h2>🏆 Wybierz ligę</h2>


<select id="leagueSelect" onchange="loadMatches()">


<option value="">
-- wybierz ligę --
</option>


<option value="Ekstraklasa">
🏆 Ekstraklasa
</option>


<option value="1 Liga">
🥇 1 Liga
</option>


<option value="2 Liga">
🥈 2 Liga
</option>


</select>


</div>






<!-- TUTAJ POJAWIAJĄ SIĘ MECZE -->

<div id="matches">


<h2>
Wybierz kolejkę oraz ligę
</h2>


</div>







<button onclick="saveTips()">

💾 Zapisz typy

</button>




<p id="message"></p>



</div>







<script src="mecze.js"></script>

<script src="script.js"></script>


</body>


</html>
