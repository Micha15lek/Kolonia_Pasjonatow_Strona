<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Typowanie - Kolonia Pasjonatów</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>


<h1>🌟 Kolonia Pasjonatów</h1>


<p>
⚽ System typowania meczów
</p>



<nav>


<a href="index.html">
🏠 Start
</a>


<a href="typowanie.html">
⚽ Typowanie
</a>


<a href="ranking.html">
📊 Ranking
</a>


<a href="kontakt.html">
📩 Kontakt
</a>



<button id="themeButton">
☀️ Tryb jasny
</button>


</nav>


</header>






<main>



<section class="typing-container">



<h2>
⚽ Typowanie
</h2>



<p class="typing-description">

Wybierz kolejkę oraz ligę, następnie wpisz swoje przewidywane wyniki.

</p>





<div class="typing-form">



<label>
👤 Nazwa użytkownika Discord
</label>


<input 
id="username"
type="text"
placeholder="Wpisz nazwę użytkownika">






<label>
📅 Kolejka
</label>


<select 
id="roundSelect"
onchange="loadMatches()">


<option value="">
Wybierz kolejkę
</option>


<option value="Kolejka 1">
Kolejka 1
</option>


<option value="Kolejka 2">
Kolejka 2
</option>


<option value="Kolejka 3">
Kolejka 3
</option>


</select>







<label>
🏆 Liga
</label>


<select 
id="leagueSelect"
onchange="loadMatches()">



<option value="">
Wybierz ligę
</option>


<option value="Ekstraklasa">
🏆 Ekstraklasa
</option>


<option value="1 Liga">
🥇 1 Liga
</option>


<option value="2 Liga">
🥈 2 Liga
</option>



</select>



</div>






<section id="matches">


<h2>
Wybierz kolejkę i ligę
</h2>


</section>







<button 
class="save-button"
onclick="saveTips()">

💾 Zapisz typy

</button>





<p id="message"></p>





</section>



</main>






<footer>

© 2026 Kolonia Pasjonatów

</footer>






<script src="mecze.js"></script>

<script src="script.js"></script>



</body>

</html>
