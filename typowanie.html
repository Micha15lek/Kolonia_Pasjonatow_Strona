<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Typowanie meczów - Kolonia Pasjonatów</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<div class="container">


<h1>⚽ Typowanie meczów</h1>

<p>
🏆 Kolonia Pasjonatów
</p>



<div class="user-panel">


<h2>👤 Użytkownik</h2>


<input 
id="username"
placeholder="Wpisz nazwę Discord">



<h2>📅 Kolejka</h2>


<select id="roundSelect" onchange="loadMatches()">



<option value="">
-- wybierz kolejkę --
</option>



<option value="Kolejka 2">
Kolejka 2
</option>



</select>






<h2>⚽ Liga</h2>


<select id="leagueSelect" onchange="loadMatches()">



<option value="">
-- wybierz ligę --
</option>



<option value="Ekstraklasa">
🏆 Ekstraklasa
</option>



<option value="1 Liga">
🥇 1 Liga
</option>



<option value="2 Liga">
🥈 2 Liga
</option>



</select>



</div>






<div id="matches">


<h2>
Wybierz kolejkę i ligę
</h2>


</div>






<button onclick="saveTips()">

💾 Zapisz typy

</button>




<p id="message"></p>



</div>






<script src="mecze.js"></script>

<script src="script.js"></script>



</body>


</html>
