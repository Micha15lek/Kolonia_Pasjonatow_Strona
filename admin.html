<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel Admina - Kolonia Pasjonatów</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>🔐 Panel Admina</h1>

<p>Kolonia Pasjonatów - zarządzanie typami</p>


<nav>

<a href="index.html">🏠 Start</a>

<a href="typowanie.html">⚽ Typowanie</a>

<a href="ranking.html">📊 Ranking</a>

<a href="admin.html">🔐 Admin</a>

</nav>


</header>





<main>





<section class="admin-box">


<h2>📅 Filtr kolejki</h2>


<select id="roundFilter" onchange="filterUsers()">


<option value="all">
Wszystkie kolejki
</option>


<option value="Kolejka 2">
Kolejka 2
</option>


<option value="Kolejka 3">
Kolejka 3
</option>


<option value="Kolejka 4">
Kolejka 4
</option>


<option value="Kolejka 5">
Kolejka 5
</option>


</select>


</section>







<section class="admin-box">


<h2>👥 Użytkownicy</h2>


<div id="users">


<!-- tutaj będą użytkownicy -->


<div class="card" onclick="showUser('Michał')">


<h3>
👤 Michał
</h3>


<p>
📅 Kolejka 2
</p>


<p>
⚽ Typów: 9
</p>


</div>





<div class="card" onclick="showUser('Kuba')">


<h3>
👤 Kuba
</h3>


<p>
📅 Kolejka 2
</p>


<p>
⚽ Typów: 9
</p>


</div>





</div>


</section>









<section class="admin-box">


<h2>📋 Typy użytkownika</h2>



<div id="userTips">


<p>
Kliknij użytkownika, aby zobaczyć typy.
</p>


</div>



</section>








</main>









<script>


function showUser(user){


let box =
document.getElementById("userTips");



box.innerHTML = `

<h2>👤 ${user}</h2>


<h3>🏆 Ekstraklasa</h3>


<div class="box">

⚽ Drużyna A - Drużyna B

<br>

Typ: 2 - 1

</div>



<h3>🥇 1 Liga</h3>


<div class="box">

⚽ Drużyna C - Drużyna D

<br>

Typ: 1 - 0

</div>




<h3>🥈 2 Liga</h3>


<div class="box">

⚽ Drużyna E - Drużyna F

<br>

Typ: 0 - 2

</div>


`;


}





function filterUsers(){


console.log(
"Filtr zmieniony"
);


}



</script>






</body>

</html>
