<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ⚠️ Awaria strony | Kolonia Pasjonatów
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           STRONA AWARII
        ===================================================== */

        .error-page {
            max-width: 950px;

            margin: auto;

            padding: 20px;
        }


        /* =====================================================
           GÓRNY PASEK
        ===================================================== */

        .top-bar {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .home-button,
        .theme-button {

            border: none;

            border-radius: 14px;

            padding: 12px 18px;

            cursor: pointer;

            text-decoration: none;

            font-weight: 700;

            font-size: 16px;

            transition: .25s;
        }


        .home-button:hover,
        .theme-button:hover {

            transform:
                translateY(-2px);

            filter:
                brightness(1.15);
        }


        /* =====================================================
           KARTA AWARII
        ===================================================== */

        .error-card {

            padding: 30px;

            border-radius: 22px;

            background:
                rgba(255,255,255,.07);

            border:
                1px solid rgba(255,255,255,.08);

            box-shadow:
                0 8px 25px rgba(0,0,0,.18);

            text-align: center;
        }


        .error-icon {

            font-size: 55px;

            margin-bottom: 10px;
        }


        .error-card h2 {

            margin-top: 5px;

            font-size: 28px;
        }


        .error-card p {

            line-height: 1.7;

            opacity: .75;

            max-width: 700px;

            margin:
                12px auto;
        }


        .error-status {

            display: inline-block;

            margin-top: 15px;

            padding: 10px 16px;

            border-radius: 12px;

            background:
                rgba(255,193,7,.12);

            border:
                1px solid rgba(255,193,7,.25);

            color:
                #ffc107;

            font-weight:
                800;
        }


        /* =====================================================
           JASNY TRYB
        ===================================================== */

        body.light .error-card {

            background:
                #ffffff;

            border-color:
                #dedede;

            box-shadow:
                0 8px 25px rgba(0,0,0,.07);
        }


        /* =====================================================
           RETRO
        ===================================================== */

        body.retro .error-card {

            padding: 20px;

            background:
                #c0c0c0;

            color:
                #000000;

            border:
                2px outset #ffffff;

            border-radius:
                0;

            box-shadow:
                3px 3px 0 #000000;
        }


        body.retro .error-icon {

            font-size:
                45px;
        }


        body.retro .error-card h2 {

            color:
                #000080;

            text-decoration:
                underline;
        }


        body.retro .error-card p {

            opacity:
                1;
        }


        body.retro .error-status {

            background:
                #ffff00;

            color:
                #000000;

            border:
                2px inset #808080;

            border-radius:
                0;
        }


        /* =====================================================
           TELEFONY
        ===================================================== */

        @media (max-width:600px) {

            .error-page {

                padding:
                    12px;
            }


            .home-button,
            .theme-button {

                padding:
                    9px 12px;

                font-size:
                    14px;
            }


            .error-card {

                padding:
                    20px;
            }


            .error-card h2 {

                font-size:
                    23px;
            }

        }

    </style>

</head>


<body>


<main class="error-page">


    <!-- =====================================================
         GÓRNY PASEK

         TYLKO STRONA GŁÓWNA
    ====================================================== -->

    <div class="top-bar">


        <a
            href="index.html"
            class="home-button">

            🏠 Strona główna

        </a>


        <button
            id="themeButton"
            class="theme-button"
            aria-label="Zmień motyw">

            🌙

        </button>


    </div>



    <!-- =====================================================
         KOMUNIKAT AWARII
    ====================================================== -->

    <section class="error-card">


        <div class="error-icon">
            ⚠️
        </div>


        <h1>
            Awaria strony
        </h1>


        <h2>
            Strona chwilowo niedostępna
        </h2>


        <p>

            Kod tej podstrony został naruszony,
            przez co część funkcji nie działa
            prawidłowo.

        </p>


        <p>

            Trwa przebudowa oraz naprawa
            uszkodzonych elementów strony.

        </p>


        <div class="error-status">

            🟡 Status: trwa naprawa

        </div>


    </section>


</main>



<!-- =====================================================
     SYSTEM MOTYWÓW

     🌙 CIEMNY
     ↓
     ☀️ JASNY
     ↓
     💾 RETRO
     ↓
     🌙 CIEMNY

     IDENTYCZNY JAK W HISTORII
===================================================== -->

<script>

const themeButton =
    document.getElementById("themeButton");


const savedTheme =
    localStorage.getItem("theme") || "dark";


function applyTheme(theme) {

    document.body.classList.remove(
        "light",
        "retro"
    );


    if (theme === "light") {

        document.body.classList.add("light");

        themeButton.textContent = "☀️";

    }

    else if (theme === "retro") {

        document.body.classList.add("retro");

        themeButton.textContent = "💾";

    }

    else {

        themeButton.textContent = "🌙";

    }


    localStorage.setItem(
        "theme",
        theme
    );

}


/* =====================================================
   ZASTOSOWANIE ZAPISANEGO MOTYWU
===================================================== */

applyTheme(savedTheme);


/* =====================================================
   ZMIANA MOTYWU
===================================================== */

themeButton.addEventListener(
    "click",
    () => {

        const current =
            localStorage.getItem("theme") || "dark";


        if (current === "dark") {

            applyTheme("light");

        }

        else if (current === "light") {

            applyTheme("retro");

        }

        else {

            applyTheme("dark");

        }

    }
);

</script>


</body>

</html>
